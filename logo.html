<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenShell — Rebrand Explorations · 100 Marks</title>
<style>
  :root {
    --bg: #171310;
    --bg-raised: #201b17;
    --bg-tile: #262220;
    --border: rgba(236, 231, 220, 0.09);
    --text: #ece7dc;
    --dim: #a29c8e;
    --faint: #6f6a5d;
    --accent: #e8875f;
    --accent-dim: rgba(232, 135, 95, 0.16);
    --green: #a9cbad;
    --yellow: #e5c084;
    --salmon: #e2988a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(232, 135, 95, 0.07), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 28px 32px 18px;
    background: linear-gradient(180deg, var(--bg) 78%, transparent);
    backdrop-filter: blur(6px);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px; font-weight: 600; letter-spacing: 0.02em;
  }
  h1 .prompt { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
  .swatches { display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 10px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter {
    appearance: none; border: 1px solid var(--border); background: var(--bg-raised);
    color: var(--dim); font: inherit; font-size: 11.5px;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: all 120ms ease;
  }
  .filter:hover { color: var(--text); background: rgba(236, 231, 220, 0.06); }
  .filter.on { background: var(--accent-dim); color: var(--accent); border-color: rgba(232,135,95,0.5); font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 14px;
    padding: 10px 32px 64px;
  }
  .tile {
    position: relative;
    background: var(--bg-tile);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 14px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    cursor: copy;
    transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }
  .tile:hover {
    transform: translateY(-2px);
    border-color: rgba(232, 135, 95, 0.45);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35), 0 0 0 1px rgba(232,135,95,0.12);
  }
  .tile svg { width: 72px; height: 72px; display: block; }
  .tile .meta { width: 100%; text-align: center; }
  .tile .num { color: var(--faint); font-size: 10px; letter-spacing: 0.08em; }
  .tile .name { color: var(--dim); font-size: 11px; margin-top: 2px; line-height: 1.35; }
  .tile.hidden { display: none; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--bg-raised); border: 1px solid rgba(232,135,95,0.5); color: var(--text);
    font-size: 12px; padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all 200ms ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { padding: 0 32px 40px; color: var(--faint); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1><span class="prompt">❯</span> openshell — rebrand explorations
    <span class="swatches">

      <span class="swatch" style="background:#e2988a"></span>

<footer>OpenShell brand lab — static file, no dependencies. Every mark is standalone SVG on a 64×64 grid.</footer>

const CATS = [
  ["all", "All 100"], ["prompts", "Prompts & Cursors"], ["shells", "Literal Shells"],
  ["aperture", "Open & Aperture"], ["brackets", "Brackets & Code"], ["monograms", "Monograms"],
  ["panels", "Panels & Workspace"], ["agent", "Agent & Motion"], ["waves", "Waves & Portals"],
  ["wordmarks", "Wordmarks"], ["wildcards", "Wildcards"]
];

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const toast = document.getElementById("toast");
let activeCat = "all";

const tiles = marks.map(([name, cat, inner], index) => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.dataset.cat = cat;
  const svg = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${name}">${inner}</svg>`;
  tile.innerHTML = `${svg}<div class="meta"><div class="num">${String(index + 1).padStart(3, "0")} · ${cat}</div><div class="name">${name}</div></div>`;
  tile.addEventListener("click", () => {
    navigator.clipboard.writeText(svg).then(() => {
      toast.textContent = `Copied №${index + 1} — ${name}`;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    });
  });
  grid.append(tile);
  return { tile, cat };
});

for (const [id, label] of CATS) {
  const button = document.createElement("button");
  button.className = "filter" + (id === "all" ? " on" : "");
  button.textContent = label;
  button.addEventListener("click", () => {
    activeCat = id;
    for (const b of filters.children) b.classList.toggle("on", b === button);
    let shown = 0;
    for (const { tile, cat } of tiles) {
      const visible = id === "all" || cat === id;
      tile.classList.toggle("hidden", !visible);
      if (visible) shown += 1;
    }
    document.querySelector(".sub").textContent =
      id === "all" ? `100 marks on the app palette · click any tile to copy its SVG`
                   : `${shown} marks · ${label.toLowerCase()} · click any tile to copy its SVG`;
  });
  filters.append(button);
}
</script>
